<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ES角色转盘</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#FAF8F2;color:#1B1B1B;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px;}
#app{width:100%;max-width:400px;}
h1{font-size:21px;font-weight:600;}
.sub{font-size:12px;color:#8B8574;}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.placeholder{font-size:14px;color:#8B8574;padding-top:20px;text-align:center;}
#pairResult{margin-top:16px;min-height:96px;}
.names{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;}
.ab{font-size:12px;color:#8B8574;border:1px solid #E3DED0;border-radius:6px;padding:2px 6px;}
.bigname{font-size:25px;font-weight:600;}
.amp{font-size:19px;color:#8B8574;}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #E3DED0;border-radius:6px;padding:3px 8px;font-size:12px;color:#6B6656;background:#FFFDF6;}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.btnrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn2{padding:8px 14px;font-size:14px;background:#FFFDF6;color:#1B1B1B;border:1px solid #D8D2C0;border-radius:8px;cursor:pointer;}
.btn2:active{background:#F1EEE6;}
.btn2:disabled{opacity:.35;cursor:default;}
.wheels{display:flex;gap:12px;margin-top:10px;align-items:flex-start;}
.wcol{flex:1;position:relative;padding-top:14px;}
.ptr{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #1B1B1B;z-index:2;}
canvas.wheel{display:block;width:100%;aspect-ratio:1/1;}
.wlabel{text-align:center;font-size:12px;color:#8B8574;margin-top:4px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;}
.stepper .lab{font-size:13px;color:#6B6656;}
.stepper .num{font-size:15px;font-weight:600;min-width:14px;text-align:center;}
.stepper .sq{width:34px;padding:6px 0;font-size:16px;line-height:1;text-align:center;}
.tags{display:flex;gap:8px;margin-top:12px;}
.tag{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #E3DED0;background:#F1EEE6;color:#8B8574;transition:all .15s ease;user-select:none;}
.tag .dot{width:8px;height:8px;border-radius:50%;flex:none;}
#spinBtn{width:100%;padding:13px 16px;border:none;border-radius:10px;background:#1B1B1B;color:#FAF8F2;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;}
#spinBtn:disabled{opacity:.35;cursor:default;}
.histlabel{font-size:12px;color:#8B8574;margin:16px 0 6px;}
#hist{display:flex;flex-wrap:wrap;gap:6px;}
.hrow{display:inline-flex;align-items:center;border:1px solid #E3DED0;border-radius:6px;padding:3px 8px;font-size:12px;color:#6B6656;background:#FFFDF6;}
.credit{text-align:center;font-size:11px;color:#B0AA9C;margin-top:20px;}
.pop{animation:pop .3s ease-out;}
@keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <h1>ES角色转盘</h1>
    <div class="sub" id="countLabel">49 人 · 不重复</div>
  </div>
  <div id="pairResult"><div class="placeholder">初始 49 人阵容，点亮标签可加人</div></div>
  <div class="wheels" id="wheelRow" style="flex-wrap:nowrap;">
    <div class="wcol">
      <div class="ptr"></div>
      <canvas class="wheel" id="w0"></canvas>
      <div class="wlabel">转盘 A</div>
    </div>
    <div class="wcol">
      <div class="ptr"></div>
      <canvas class="wheel" id="w1"></canvas>
      <div class="wlabel">转盘 B</div>
    </div>
    <div class="wcol" id="col2" style="display:none;">
      <div class="ptr"></div>
      <canvas class="wheel" id="w2"></canvas>
      <div class="wlabel">转盘 C</div>
    </div>
    <div class="wcol" id="col3" style="display:none;">
      <div class="ptr"></div>
      <canvas class="wheel" id="w3"></canvas>
      <div class="wlabel">转盘 D</div>
    </div>
    <div class="wcol" id="col4" style="display:none;">
      <div class="ptr"></div>
      <canvas class="wheel" id="w4"></canvas>
      <div class="wlabel">转盘 E</div>
    </div>
    <div class="wcol" id="col5" style="display:none;">
      <div class="ptr"></div>
      <canvas class="wheel" id="w5"></canvas>
      <div class="wlabel">转盘 F</div>
    </div>
    <div class="wcol" id="col6" style="display:none;">
      <div class="ptr"></div>
      <canvas class="wheel" id="w6"></canvas>
      <div class="wlabel">转盘 G</div>
    </div>
    <div class="wcol" id="col7" style="display:none;">
      <div class="ptr"></div>
      <canvas class="wheel" id="w7"></canvas>
      <div class="wlabel">转盘 H</div>
    </div>
  </div>
  <div class="stepper">
    <span class="lab">转盘数量</span>
    <button class="btn2 sq" id="btnMinus">−</button>
    <span class="num" id="wheelNum">2</span>
    <button class="btn2 sq" id="btnPlus">＋</button>
  </div>
  <div class="tags">
    <div class="tag" id="tagIbuki"></div>
    <div class="tag" id="tagEspri"></div>
    <div class="tag" id="tagMdu"></div>
    <div class="tag" id="tagOther"></div>
    <div class="tag" id="tagDup"></div>
  </div>
  <button id="spinBtn">随机</button>
  <div class="histlabel">抽取记录</div>
  <div id="hist"></div>
  <div class="credit">该转盘由 逢昼時颂hirUta 制作</div>
</div>
<script>
(function(){
var TAU = Math.PI*2;
function letterOf(i){
  if(i < 26) return String.fromCharCode(65 + i);
  return String.fromCharCode(64 + Math.floor(i/26)) + String.fromCharCode(65 + i % 26);
}
function C(name, unit, group, color){ return {name:name, unit:unit, group:group, color:color}; }
var BASE = [
  C('冰鹰北斗','Trickstar','base','#0C6AB2'),C('明星昴流','Trickstar','base','#ED9624'),C('游木真','Trickstar','base','#69BA37'),C('衣更真绪','Trickstar','base','#8D0D55'),
  C('天祥院英智','fine','base','#F0D148'),C('日日树涉','fine','base','#61CED6'),C('姬宫桃李','fine','base','#E34779'),C('伏见弓弦','fine','base','#5570B6'),
  C('月永雷欧','Knights','base','#E06259'),C('濑名泉','Knights','base','#3C8DBF'),C('朔间凛月','Knights','base','#1A4071'),C('鸣上岚','Knights','base','#A69149'),C('朱樱司','Knights','base','#8C1544'),
  C('莲巳敬人','红月','base','#376D46'),C('鬼龙红郎','红月','base','#D5272D'),C('神崎飒马','红月','base','#584C98'),
  C('守泽千秋','流星队','base','#C10027'),C('深海奏汰','流星队','base','#4169E1'),C('南云铁虎','流星队','base','#404040'),C('仙石忍','流星队','base','#BFA02D'),C('高峯翠','流星队','base','#36BF36'),
  C('斋宫宗','Valkyrie','base','#DF3F90'),C('影片美伽','Valkyrie','base','#0C746A'),
  C('朔间零','UNDEAD','base','#431E6A'),C('羽风薰','UNDEAD','base','#EBAD21'),C('大神晃牙','UNDEAD','base','#939094'),C('乙狩阿多尼斯','UNDEAD','base','#8D53A2'),
  C('仁兔成鸣','Ra*bits','base','#FABC13'),C('天满光','Ra*bits','base','#E45B41'),C('真白友也','Ra*bits','base','#CFAF58'),C('紫之创','Ra*bits','base','#B697CB'),
  C('逆先夏目','Switch','base','#D02662'),C('青叶纺','Switch','base','#3091B4'),C('春川宙','Switch','base','#F4C609'),
  C('葵日向','2wink','base','#F65A9E'),C('葵裕太','2wink','base','#0DADE4'),
  C('三毛缟斑','MaM','base','#5E2C1C'),
  C('乱凪砂','Eden','base','#B9492F'),C('巴日和','Eden','base','#69B737'),C('涟纯','Eden','base','#192F60'),C('七种茨','Eden','base','#B4339A'),
  C('天城燐音','Crazy:B','base','#AA263C'),C('HiMERU','Crazy:B','base','#6FB7E3'),C('樱河琥珀','Crazy:B','base','#DE4E7A'),C('椎名丹希','Crazy:B','base','#4D7DAE'),
  C('天城一彩','ALKALOID','base','#AE163B'),C('白鸟蓝良','ALKALOID','base','#CFAF58'),C('礼濑真宵','ALKALOID','base','#59246F'),C('风早巽','ALKALOID','base','#5CC491')
];
var ESPRI = [
  C('冴雾笑主','Special for Princess!','espri','#38FFF5'),C('花群冬芽','Special for Princess!','espri','#D2ACDC'),
  C('名都神无','Special for Princess!','espri','#B6CCB6'),C('宝丈莱香','Special for Princess!','espri','#008E7D')
];
var MDU = [
  C('小鹿杰斯','MELLOW DEAR US','mdu','#52CC53'),C('圆果望见','MELLOW DEAR US','mdu','#981558'),
  C('久远舞珠','MELLOW DEAR US','mdu','#F37A89'),C('甘乐千岁','MELLOW DEAR US','mdu','#304780')
];
var IBUKI = [
  C('泷维吹','新生红月','ibuki','#3FBFD0')
];
var OTHER = [
  C('小杏','制作人','other','#D77FA1'),C('佐贺美阵','梦之咲教师','other','#778899'),C('门章臣','梦之咲教师','other','#B85798'),
  C('十条要','4piece参加者','other','#D9822B'),C('黑根棺','4piece制作','other','#241F2E'),
  C('NiceP','MDU制作人','other','#B08A3E'),C('冰鹰诚矢','演员','other','#1F4E79')
];
var on = {ibuki:false, espri:false, mdu:false, other:false};
function pool(){
  var p = BASE.slice();
  if(on.ibuki) p = p.concat(IBUKI);
  if(on.espri) p = p.concat(ESPRI);
  if(on.mdu) p = p.concat(MDU);
  if(on.other) p = p.concat(OTHER);
  return p;
}
var TAGS = [
  {id:'ibuki', label:'维吹', color:'#3FBFD0'},
  {id:'espri', label:'心团', color:'#C98BB4'},
  {id:'mdu', label:'巧团', color:'#4D2118'},
  {id:'other', label:'其他', color:'#6B7280'}
];
TAGS.forEach(function(t){
  var el = document.getElementById('tag' + (t.id==='ibuki'?'Ibuki':t.id==='espri'?'Espri':t.id==='mdu'?'Mdu':'Other'));
  el.innerHTML = '<span class="dot" style="background:' + t.color + ';"></span>' + t.label;
  el.addEventListener('click', function(){
    on[t.id] = !on[t.id];
    if(on[t.id]){
      el.style.background = t.color + '2E';
      el.style.borderColor = t.color;
      el.style.color = '#1B1B1B';
      el.style.fontWeight = '600';
    } else {
      el.style.background = '#F1EEE6';
      el.style.borderColor = '#E3DED0';
      el.style.color = '#8B8574';
      el.style.fontWeight = '400';
    }
    refreshPool();
  });
});
var allowDup = false;
var dupEl = document.getElementById('tagDup');
var DUP_COLOR = '#3A6EA5';
function renderDupTag(){
  dupEl.innerHTML = '<span class="dot" style="background:' + DUP_COLOR + ';"></span>' + (allowDup ? '可重复' : '不重复');
  if(allowDup){
    dupEl.style.background = DUP_COLOR + '2E';
    dupEl.style.borderColor = DUP_COLOR;
    dupEl.style.color = '#1B1B1B';
    dupEl.style.fontWeight = '600';
  } else {
    dupEl.style.background = '#F1EEE6';
    dupEl.style.borderColor = '#E3DED0';
    dupEl.style.color = '#8B8574';
    dupEl.style.fontWeight = '400';
  }
}
dupEl.addEventListener('click', function(){
  allowDup = !allowDup;
  renderDupTag();
  countEl.textContent = POOL.length + ' 人 · ' + (allowDup ? '可重复' : '不重复');
});
var wheelRow = document.getElementById('wheelRow');
var wheels = [];
function ensureWheel(i){
  while(wheels.length <= i){
    var idx = wheels.length;
    var existing = idx < 8 ? document.getElementById('w' + idx) : null;
    var col, cv;
    if(existing){
      col = existing.parentElement; cv = existing;
    } else {
      col = document.createElement('div');
      col.className = 'wcol';
      col.style.cssText = 'display:none;';
      col.innerHTML = '<div class="ptr"></div><canvas class="wheel"></canvas><div class="wlabel">转盘 ' + letterOf(idx) + '</div>';
      wheelRow.appendChild(col);
      cv = col.querySelector('canvas');
    }
    wheels.push({cv:cv, col:col, rot:0, size:0, ctx:cv.getContext('2d')});
  }
}
var wheelCount = 2;
var POOL = pool(), STEP = TAU/POOL.length;
var spinning = false, pairs = [];
var btn = document.getElementById('spinBtn'), resEl = document.getElementById('pairResult'),
    histEl = document.getElementById('hist'), countEl = document.getElementById('countLabel'),
    wheelNum = document.getElementById('wheelNum'), btnMinus = document.getElementById('btnMinus'), btnPlus = document.getElementById('btnPlus');
function textFor(hex){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*299 + g*587 + b*114)/1000 > 150 ? 'rgba(20,20,20,0.88)' : 'rgba(255,255,255,0.95)';
}
function shade(hex){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  if((r*299 + g*587 + b*114)/1000 > 165){ r = Math.round(r*0.55); g = Math.round(g*0.55); b = Math.round(b*0.55); }
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
var QREXP = (function(){
  var EXP = new Array(512), LOG = new Array(256), x = 1, i;
  for(i = 0; i < 255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if(x & 0x100) x ^= 0x11d; }
  for(i = 255; i < 512; i++) EXP[i] = EXP[i-255];
  function mul(a,b){ return (a && b) ? EXP[LOG[a]+LOG[b]] : 0; }
  function rs(data, ecLen){
    var gen = [1], j;
    for(i = 0; i < ecLen; i++){
      var ng = new Array(gen.length+1).fill(0);
      for(j = 0; j < gen.length; j++){ ng[j] ^= mul(gen[j], EXP[i]); ng[j+1] ^= gen[j]; }
      gen = ng;
    }
    var res = data.concat(new Array(ecLen).fill(0));
    for(i = 0; i < data.length; i++){
      var c = res[i];
      if(c) for(j = 0; j < gen.length; j++) res[i+j] ^= mul(gen[j], c);
    }
    return res.slice(data.length);
  }
  function encode(text){
    var bytes = [], k;
    for(var ii = 0; ii < text.length; ii++) bytes.push(text.charCodeAt(ii) & 255);
    var cap = [0,19,34,55,80,108], ver = 0;
    for(var v = 1; v <= 5; v++){ if(bytes.length + 2 <= cap[v]){ ver = v; break; } }
    if(!ver) return null;
    var size = 17 + 4*ver, bits = [];
    function push(val, n){ for(k = n-1; k >= 0; k--) bits.push((val >>> k) & 1); }
    push(4,4); push(bytes.length, 8);
    for(ii = 0; ii < bytes.length; ii++) push(bytes[ii], 8);
    push(0,4);
    var maxBits = cap[ver]*8;
    if(bits.length > maxBits) bits.length = maxBits;
    while(bits.length % 8) bits.push(0);
    var data = [];
    for(ii = 0; ii < bits.length; ii += 8){ var b = 0; for(k = 0; k < 8; k++) b = (b << 1) | bits[ii+k]; data.push(b); }
    var pad = 0xEC;
    while(data.length < cap[ver]){ data.push(pad); pad = (pad === 0xEC) ? 0x11 : 0xEC; }
    var all = data.concat(rs(data, [0,7,10,15,20,26][ver]));
    var m = [];
    for(ii = 0; ii < size; ii++) m.push(new Array(size).fill(-1));
    function finder(r0, c0){
      for(var r = -1; r < 8; r++) for(var c = -1; c < 8; c++){
        var rr = r0+r, cc = c0+c;
        if(rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
        if(r >= 0 && r < 7 && c >= 0 && c < 7){
          m[rr][cc] = (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) ? 1 : 0;
        } else if(m[rr][cc] === -1) m[rr][cc] = 0;
      }
    }
    finder(0,0); finder(0,size-7); finder(size-7,0);
    for(ii = 8; ii <= size-9; ii++){
      if(m[6][ii] === -1) m[6][ii] = (ii % 2 === 0) ? 1 : 0;
      if(m[ii][6] === -1) m[ii][6] = (ii % 2 === 0) ? 1 : 0;
    }
    var ap = [0,0,18,22,26,30][ver];
    if(ap){
      [[6,ap],[ap,6],[ap,ap]].forEach(function(pt){
        for(var r = -2; r <= 2; r++) for(var c = -2; c <= 2; c++){
          m[pt[0]+r][pt[1]+c] = (Math.max(Math.abs(r),Math.abs(c)) !== 1) ? 1 : 0;
        }
      });
    }
    m[4*ver+9][8] = 1;
    function resv(r, c){ if(r >= 0 && r < size && c >= 0 && c < size && m[r][c] === -1) m[r][c] = -2; }
    for(ii = 0; ii <= 5; ii++) resv(8,ii);
    resv(8,7); resv(8,8); resv(7,8);
    for(ii = 0; ii <= 5; ii++) resv(ii,8);
    for(ii = 0; ii <= 6; ii++) resv(size-1-ii, 8);
    for(ii = 0; ii <= 7; ii++) resv(8, size-8+ii);
    var bitIdx = 0, totalBits = all.length * 8;
    function nextBit(){
      if(bitIdx < totalBits){ var bit = (all[bitIdx>>3] >>> (7-(bitIdx & 7))) & 1; bitIdx++; return bit; }
      return 0;
    }
    var inc = -1, row = size-1;
    for(var col = size-1; col > 0; col -= 2){
      if(col === 6) col--;
      while(true){
        for(var c2 = 0; c2 < 2; c2++){
          var cc = col - c2;
          if(m[row][cc] === -1){
            var bit = nextBit();
            if(((row + cc) % 2) === 0) bit ^= 1;
            m[row][cc] = bit;
          }
        }
        row += inc;
        if(row < 0 || row >= size){ row -= inc; inc = -inc; break; }
      }
    }
    var fmt = 0x77C4;
    for(ii = 0; ii <= 5; ii++) m[8][ii] = (fmt >>> (14-ii)) & 1;
    m[8][7] = (fmt >>> 8) & 1; m[8][8] = (fmt >>> 7) & 1; m[7][8] = (fmt >>> 6) & 1;
    for(ii = 0; ii <= 5; ii++) m[5-ii][8] = (fmt >>> (5-ii)) & 1;
    for(ii = 0; ii <= 7; ii++) m[size-1-ii][8] = (fmt >>> (14-ii)) & 1;
    for(ii = 0; ii <= 8; ii++) m[8][size-8+ii] = (fmt >>> (7-ii)) & 1;
    return m;
  }
  return {encode:encode};
})();
var FONT_STACK = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
function drawWheel(w){
  if(!w.size) return;
  var ctx = w.ctx, size = w.size, R = size/2 - 2, cx = size/2, cy = size/2, n = POOL.length;
  ctx.clearRect(0,0,size,size);
  var fs = n >= 55 ? 6.0 : n >= 52 ? 6.4 : 6.8;
  if(size < 110) fs = 5.4;
  if(size < 80) fs = 4.8;
  ctx.font = fs + 'px ' + FONT_STACK;
  ctx.textBaseline = 'middle';
  for(var i = 0; i < n; i++){
    var a0 = i*STEP + w.rot - Math.PI/2, mid = a0 + STEP/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a0+STEP); ctx.closePath();
    ctx.fillStyle = POOL[i].color; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 0.7; ctx.stroke();
    var label = POOL[i].name, tw = ctx.measureText(label).width;
    var off = 18 + Math.max(0,(R-6-18-tw)/2);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid);
    ctx.fillStyle = textFor(POOL[i].color);
    if(Math.cos(mid) >= 0){ ctx.textAlign = 'left'; ctx.fillText(label, off, 0); }
    else { ctx.rotate(Math.PI); ctx.textAlign = 'right'; ctx.fillText(label, -off, 0); }
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx,cy,15,0,TAU);
  ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.strokeStyle = '#1B1B1B'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = '#1B1B1B'; ctx.font = '600 8px ' + FONT_STACK;
  ctx.textAlign = 'center'; ctx.fillText('ES', cx, cy+0.5);
}
function refreshPool(){
  POOL = pool(); STEP = TAU/POOL.length;
  if(!allowDup && wheelCount > POOL.length) setCount(POOL.length);
  countEl.textContent = POOL.length + ' 人 · ' + (allowDup ? '可重复' : '不重复');
  wheels.forEach(function(w){ if(w.size) drawWheel(w); });
}
function resizeAll(){
  var dpr = window.devicePixelRatio || 1;
  wheels.forEach(function(w, i){
    if(i >= wheelCount){ w.size = 0; return; }
    var s = w.col.clientWidth;
    w.size = s;
    w.cv.width = Math.round(s*dpr); w.cv.height = Math.round(s*dpr);
    w.ctx.setTransform(dpr,0,0,dpr,0,0);
    drawWheel(w);
  });
}
function setCount(k){
  wheelCount = Math.max(1, k);
  ensureWheel(wheelCount - 1);
  wheelNum.textContent = wheelCount;
  btnMinus.disabled = wheelCount <= 1;
  var row = wheelRow;
  if(wheelCount > 4){
    row.style.flexWrap = 'wrap';
    wheels.forEach(function(w){ w.col.style.flex = '0 0 calc(25% - 9px)'; });
  } else {
    row.style.flexWrap = 'nowrap';
    wheels.forEach(function(w){ w.col.style.flex = '1'; });
  }
  wheels.forEach(function(w, i){ w.col.style.display = i < wheelCount ? '' : 'none'; });
  requestAnimationFrame(resizeAll);
}
btnMinus.addEventListener('click', function(){ setCount(wheelCount - 1); });
btnPlus.addEventListener('click', function(){ setCount(wheelCount + 1); });
window.addEventListener('resize', resizeAll);
function easeOut(t){ return 1 - Math.pow(1-t, 4); }
function norm(x){ return ((x % TAU) + TAU) % TAU; }
function pickIndices(k, n){
  if(allowDup){
    var r = [];
    for(var i = 0; i < k; i++) r.push(Math.floor(Math.random()*n));
    return r;
  }
  var arr = [];
  for(var i = 0; i < n; i++) arr.push(i);
  for(var i = 0; i < k; i++){
    var j = i + Math.floor(Math.random()*(n - i));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr.slice(0, k);
}
function spin(){
  if(spinning) return;
  spinning = true; btn.disabled = true; btn.textContent = '转动中…';
  var n = POOL.length;
  var idxs = pickIndices(Math.min(wheelCount, n), n);
  var jobs = [];
  for(var i = 0; i < wheelCount; i++){
    var w = wheels[i], idx = idxs[i];
    var target = -(Math.PI/2) - (idx + 0.5)*STEP;
    jobs.push({ w:w, start:w.rot, dist: TAU*(5 + Math.floor(Math.random()*3)) + norm(target - w.rot),
      dur: 4200 + Math.min(i*350, 2500) + Math.random()*700 });
  }
  var t0 = performance.now();
  function frame(now){
    var done = true;
    jobs.forEach(function(j){
      var p = Math.min(1, (now - t0)/j.dur);
      if(p < 1) done = false;
      j.w.rot = j.start + j.dist*easeOut(p);
      drawWheel(j.w);
    });
    if(!done) requestAnimationFrame(frame);
    else { spinning = false; btn.disabled = false; btn.textContent = '随机'; showPair(idxs); }
  }
  requestAnimationFrame(frame);
}
function roundRect(x, px, py, w, h, r){
  x.beginPath(); x.moveTo(px+r, py);
  x.arcTo(px+w, py, px+w, py+h, r); x.arcTo(px+w, py+h, px, py+h, r);
  x.arcTo(px, py+h, px, py, r); x.arcTo(px, py, px+w, py, r); x.closePath();
}
function buildCard(chars){
  var url = location.href || '';
  var W = 900, H = 1200;
  var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var x = cv.getContext('2d');
  var F = FONT_STACK;
  x.fillStyle = '#FFFDF6'; x.fillRect(0,0,W,H);
  x.strokeStyle = '#E7E0CF'; x.lineWidth = 2; x.strokeRect(24,24,W-48,H-48);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#1B1B1B'; x.font = '600 46px ' + F;
  x.fillText('ES角色转盘', W/2, 116);
  x.fillStyle = '#8B8574'; x.font = '25px ' + F;
  x.fillText(chars.length + ' 位角色 · 随机结果', W/2, 166);
  x.strokeStyle = '#E7E0CF'; x.beginPath(); x.moveTo(120,208); x.lineTo(W-120,208); x.stroke();
  var sep = '  &  ';
  var fs = 62;
  function measureNames(){
    x.font = '600 ' + fs + 'px ' + F;
    var ws = chars.map(function(c){ return x.measureText(c.name).width; });
    var sw = x.measureText(sep).width;
    var total = sw * (chars.length - 1);
    ws.forEach(function(v){ total += v; });
    return {ws:ws, sw:sw, total:total};
  }
  var m = measureNames();
  while(m.total > W-140 && fs > 14){ fs -= 5; m = measureNames(); }
  var sx = (W - m.total)/2;
  x.textAlign = 'left';
  for(var i = 0; i < chars.length; i++){
    if(i > 0){ x.fillStyle = '#8B8574'; x.fillText(sep, sx, 430); sx += m.sw; }
    x.fillStyle = shade(chars[i].color); x.fillText(chars[i].name, sx, 430);
    sx += m.ws[i];
  }
  x.textAlign = 'center';
  function chipOnCard(c, cy2, cx){
    cx = cx || W/2;
    x.font = '25px ' + F;
    var t = c.unit, tw2 = x.measureText(t).width;
    var w = tw2 + 68, h = 46;
    roundRect(x, cx - w/2, cy2 - h/2, w, h, 23);
    x.fillStyle = '#FFFDF6'; x.fill();
    x.strokeStyle = '#CFC8B6'; x.lineWidth = 1.5; x.stroke();
    x.beginPath(); x.arc(cx - w/2 + 29, cy2, 8, 0, TAU); x.fillStyle = c.color; x.fill();
    x.fillStyle = '#4A463C'; x.textAlign = 'left'; x.fillText(t, cx - w/2 + 47, cy2 + 1);
    x.textAlign = 'center';
  }
  if(chars.length <= 4){
    for(var i = 0; i < chars.length; i++) chipOnCard(chars[i], 492 + i*56);
  } else {
    var cols = [W*0.27, W*0.73];
    for(var i = 0; i < chars.length; i++) chipOnCard(chars[i], 480 + Math.floor(i/2)*50, cols[i % 2]);
  }
  if(url.indexOf('http') === 0){
    var qr = QREXP.encode(url);
    if(qr){
      var n = qr.length, ms = Math.floor(232/(n+8));
      var qw = (n+8)*ms, qx = 82, qy = H - 96 - qw;
      x.fillStyle = '#FFFFFF'; x.fillRect(qx-10, qy-10, qw+20, qw+20);
      x.strokeStyle = '#CFC8B6'; x.lineWidth = 1; x.strokeRect(qx-10, qy-10, qw+20, qw+20);
      x.fillStyle = '#111';
      for(var r = 0; r < n; r++) for(var c2 = 0; c2 < n; c2++) if(qr[r][c2]) x.fillRect(qx + c2*ms, qy + r*ms, ms, ms);
      x.fillStyle = '#8B8574'; x.font = '22px ' + F; x.textAlign = 'center';
      x.fillText('扫码一起玩', qx - 10 + (qw+20)/2, qy + qw + 34);
    }
  } else {
    x.fillStyle = '#8B8574'; x.font = '23px ' + F; x.textAlign = 'left';
    x.fillText('提示：本页托管到公网后，', 90, H - 170);
    x.fillText('二维码将自动指向本页链接', 90, H - 128);
  }
  x.fillStyle = '#9C968A'; x.font = '22px ' + F; x.textAlign = 'right';
  x.fillText('该转盘由 逢昼時颂hirUta 制作', W-70, H-80);
  return cv.toDataURL('image/png');
}
function saveShare(chars){
  try{
    var url = buildCard(chars);
    var file = 'es-wheel-' + chars.map(function(c){ return c.name; }).join('-') + '.png';
    var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
    if(isIOS){
      var w = window.open('', '_blank');
      if(w){
        w.document.title = 'ES角色转盘 · 分享图';
        w.document.body.style.cssText = 'margin:0;background:#111;text-align:center;';
        var img = w.document.createElement('img');
        img.src = url; img.alt = file;
        img.style.cssText = 'display:block;width:100%;max-width:520px;margin:0 auto;';
        w.document.body.appendChild(img);
        var tip = w.document.createElement('p');
        tip.textContent = '长按图片 → 存储到照片，即可保存分享图';
        tip.style.cssText = 'color:#999;font-size:13px;font-family:sans-serif;padding:12px;';
        w.document.body.appendChild(tip);
        return;
      }
    }
    var a = document.createElement('a');
    a.href = url; a.download = file;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); }, 100);
  }catch(e){}
}
function showPair(idxs){
  var chars = idxs.map(function(i){ return POOL[i]; });
  resEl.innerHTML = '';
  var box = document.createElement('div');
  box.className = 'pop';
  var names = document.createElement('div');
  names.className = 'names';
  var html = '';
  for(var i = 0; i < chars.length; i++){
    if(i > 0) html += '<span class="amp">&amp;</span>';
    html += '<span class="ab">' + letterOf(i) + '</span><span class="bigname" style="color:' + shade(chars[i].color) + ';">' + chars[i].name + '</span>';
  }
  names.innerHTML = html;
  var chips = document.createElement('div');
  chips.className = 'chips';
  chips.innerHTML = chars.map(function(c){
    return '<span class="chip"><span class="dot" style="background:' + c.color + ';"></span>' + c.unit + '</span>';
  }).join('');
  var btns = document.createElement('div');
  btns.className = 'btnrow';
  var share = document.createElement('button');
  share.className = 'btn2';
  share.textContent = '保存分享图';
  share.addEventListener('click', function(){ saveShare(chars); });
  btns.appendChild(share);
  box.appendChild(names); box.appendChild(chips); box.appendChild(btns);
  resEl.appendChild(box);
  pairs.unshift(chars);
  if(pairs.length > 6) pairs.pop();
  histEl.innerHTML = '';
  pairs.forEach(function(p){
    var s = document.createElement('span');
    s.className = 'hrow';
    s.textContent = p.map(function(c){ return c.name; }).join(' × ');
    histEl.appendChild(s);
  });
}
btn.addEventListener('click', spin);
renderDupTag();
setCount(2);
refreshPool();
})();
</script>
